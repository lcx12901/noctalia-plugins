id = "wktl/okx-monitor"
name = "OKX Monitor"
version = "1.1.0"
plugin_api = 3
author = "wktl"
license = "MIT"
dependencies = []
tags = ["crypto", "trading", "finance"]
icon = "chart"
description = "OKX position monitor — total floating PnL in the bar, position list in the panel."

[[setting]]
key = "mode"
type = "select"
label_key = "settings.mode.label"
default = "live"
options = [
  { value = "demo", label_key = "settings.mode.options.demo" },
  { value = "live", label_key = "settings.mode.options.live" },
]

[[service]]
id = "position_service"
entry = "position_service.luau"

[[widget]]
id = "pnl"
entry = "pnl.luau"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 900
height = 400
placement = "attached"
